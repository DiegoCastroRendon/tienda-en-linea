<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h2>Iniciar Sesión</h2>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <div class="input-group">
          <span class="input-group-text">
            <fa-icon icon="user"></fa-icon>
          </span>
          <input
            type="text"
            class="form-control"
            name="username"
            placeholder="Usuario"
            formControlName="username"
            required
          />
        </div>
        <div class="error-message" *ngIf="fg.username.invalid && fg.username.touched">
          Ingresa un username.
        </div>
      </div>
      <div class="form-group">
        <div class="input-group">
          <span class="input-group-text">
            <fa-icon icon="lock"></fa-icon>
          </span>
          <input
            type="password"
            class="form-control"
            name="password"
            placeholder="Contraseña"
            formControlName="password"
            required
          />
        </div>
        <div class="error-message" *ngIf="fg.password.invalid && fg.password.touched">
          Ingresa una contraseña
        </div>
      </div>
      <button
        type="submit"
        [disabled]="loginForm.invalid || showLoading"
        class="btn login-btn"
      >
        <i *ngIf="showLoading" class="fas fa-spinner fa-spin"></i>
        <span *ngIf="showLoading">Cargando...</span>
        <span *ngIf="!showLoading">Ingresar</span>
      </button>
    </form>
    <div class="login-footer">
      <p>
        ¿Necesitas una cuenta?
        <a routerLink="/register">Regístrate</a>
      </p>
    </div>
  </div>
</div>
